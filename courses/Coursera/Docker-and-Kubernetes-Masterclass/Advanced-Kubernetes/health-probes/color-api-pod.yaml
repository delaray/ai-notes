apiVersion: v1
kind: Pod
metadata:
  name: color-api-pod
  labels:
    name: color-api-pod
spec:
  containers:
  - name: color-api-pod
    image: delaray/color-api:1.2.0
    ports:
      - containerPort: 80
    resources:
      limits:
        cpu: "500m"
        memory: "512Mi"
    env:
      - name: DELAY_STARTUP
        value: "true"
    startupProbe:
      httpGet:
        path: /up
        port: 80
      failureThreshold: 2
      periodSeconds: 3